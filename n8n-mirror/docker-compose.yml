# Mirror local do cenario Make da VendeMais em n8n (auto-hospedavel).
# Serve para TESTAR o fluxo de verdade, ja que o Make.com nao roda local.
services:
  n8n:
    # Versao FIXADA de proposito. Nao troque por :latest -> a tag "latest"
    # muda sozinha e ja quebrou este tutorial (o login basico admin/admin
    # foi removido no n8n v1/v2). 2.28.7 foi testada end-to-end aqui
    # (import do workflow + webhook respondendo 200).
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: vendemais_n8n_mirror
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      # Injeção das chaves via variáveis de ambiente (.env)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - HUBSPOT_ACCESS_TOKEN=${HUBSPOT_ACCESS_TOKEN}
      - AIRTABLE_PAT=${AIRTABLE_PAT}
      - GOOGLE_CSE_API_KEY=${GOOGLE_CSE_API_KEY}
      - GOOGLE_CSE_ID=${GOOGLE_CSE_ID}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/home/node/workflows


volumes:
  n8n_data:

