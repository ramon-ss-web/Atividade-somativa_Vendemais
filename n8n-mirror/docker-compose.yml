# Mirror local do cenario Make da VendeMais em n8n (auto-hospedavel).
# Serve para TESTAR o fluxo de verdade, ja que o Make.com nao roda local.
services:
  n8n:
    # Versao FIXADA de proposito. Nao troque por :latest -> a tag "latest"
    # muda sozinha e ja quebrou este tutorial (o login basico admin/admin
    # foi removido no n8n v1/v2). 2.28.7 foi testada end-to-end aqui
    # (import do workflow + webhook respondendo 200).
    image: n8nio/n8n:2.28.7
    container_name: vendemais-n8n
    restart: unless-stopped
    ports:
      # So no loopback (127.0.0.1): nao expoe o editor n8n na rede local.
      - "127.0.0.1:5678:5678"
    environment:
      # ATENCAO: nao existe mais login admin/admin. No PRIMEIRO acesso o n8n
      # pede para criar uma CONTA DE DONO (owner) -> email + senha locais.
      # Qualquer valor serve, e so na sua maquina (ex.: owner@vendemais.local).
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Sao_Paulo
      # Menos atrito no curso: desliga telemetria e o questionario de onboarding.
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
